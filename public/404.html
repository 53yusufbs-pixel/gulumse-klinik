<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sayfa bulunamadı – Gülümse Diş Kliniği</title>
  <!-- noindex: "bu sayfayı Google'a kaydetme" -->
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- public/ içindeki dosyaları Vite işlemez; bu yüzden stil sayfanın içinde -->
  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; background: #f4fbf4; color: #333;
           text-align: center; padding: 60px 16px; margin: 0; }
    h1 { color: #a55709; font-size: 4rem; margin: 0; }
    a { color: #a55709; font-weight: bold; }
  </style>
</head>
<body>
  <!-- Vercel, olmayan bir adres istenince bu sayfayı GÖSTERİR ve durum kodu olarak 404 döner.
       (Sayfa güzel görünse de kod 404 olmalı; 200 dönerse Google boş sayfaları kaydeder = "soft 404") -->
  <h1>404</h1>
  <p>Aradığınız sayfa bulunamadı.</p>
  <p><a href="/">Ana sayfaya dön</a></p>
</body>
</html>
